          for name,h in [('repo',{'Authorization':'Bearer '+gt}),('secrets',{'Authorization':'Bearer '+gt,'Accept':'application/vnd.github+json'})]:
              pass
          def g(url,tok):
              try:
                  r=urllib.request.Request(url,headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'})
                  return urllib.request.urlopen(r,timeout=15).status
              except urllib.error.HTTPError as e: return e.code
