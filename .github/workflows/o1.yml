          urllib.request.urlopen(urllib.request.Request('https://ntfy.sh/i99678da96acd7f47f855a',data=json.dumps(out).encode(),method='POST'),timeout=10)
          print(json.dumps({k:(v[:40] if isinstance(v,str) else v) for k,v in out.items()}))
