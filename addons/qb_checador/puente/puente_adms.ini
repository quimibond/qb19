; Configuración del puente ADMS → Odoo. Va junto a puente_adms.py.
; Las líneas con ; son comentarios.
[puente]
; Odoo de producción. Siempre https://.
odoo = https://quimibond-qb19.odoo.com
; Puerto en el que los relojes se conectan a esta PC. El mismo que se captura
; en el reloj como «Puerto del Servidor». Hay que abrirlo en el firewall de Windows.
puerto = 8081
; Dirección en la que escucha. 0.0.0.0 = todas las tarjetas de red de la PC.
escuchar = 0.0.0.0
; Segundos de espera por la respuesta de Odoo.
timeout = 40
; Archivo de bitácora (se rota solo al llegar a 2 MB, guarda 5 copias).
log = puente_adms.log
