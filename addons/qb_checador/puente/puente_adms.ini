; Configuración del puente ADMS → Odoo. Va junto a puente_adms.py.
; Las líneas con ; son comentarios.
[puente]
; Odoo de producción. Siempre https://.
odoo = https://quimibond-qb19.odoo.com
; Puerto en el que los relojes se conectan a esta PC. El mismo que se captura
; en el reloj como «Puerto del Servidor». Hay que abrirlo en el firewall de Windows.
puerto = 8081
; Dirección en la que escucha. 0.0.0.0 = todas las tarjetas de red de la PC.
escuchar = 0.0.0.0
; Segundos de espera por la respuesta de Odoo.
timeout = 40
; Archivo de bitácora (se rota solo al llegar a 2 MB, guarda 5 copias).
log = puente_adms.log

; ---------------------------------------------------------------------------
; Relojes Hikvision que el puente CONSULTA (para los que no mandan sus eventos
; solos, como el DS-K1T804AEF de Ciruelos). Una sección por reloj; quitar los
; ; del principio y llenar. La contraseña del reloj vive solo en este archivo
; de la PC: no se sube al repo ni se captura en Odoo.
; [hikvision Ciruelos]
; IP del reloj en la red local (conviene reservarla en el router).
; ip = 192.168.1.97
; usuario = admin
; clave = CONTRASEÑA DEL RELOJ
; Token de la ficha del reloj en Odoo (lo que va después de /qb_checador/hikvision/).
; token = TOKEN
; Primer día que se manda a Odoo la primera vez (AAAA-MM-DD; sin valor, hoy).
; Después el puente sigue desde lo último que mandó (puente_hikvision.json).
; desde = 2026-10-14
; cada_segundos = 60
